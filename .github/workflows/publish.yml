# Keeps the gh-pages branch (served by GitHub Pages) identical to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gh-pages to match main
        run: git push --force origin HEAD:refs/heads/gh-pages
